#
# Checks Markdown changes, for which the Build workflow skips its native builds. The repository checks
# still apply to them: dprint formats Markdown, and tests compare documented settings with the code.
# Pull requests run these checks through the Build workflow, whose readiness check requires them.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Documentation

on: # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  push:
    # The same branches and tags as the Build workflow.
    branches-ignore:
      - "dependabot/**"
      - "dependencies/**" # Update Sources workflow
      - "gh-readonly-queue/**" # merge queue
    tags-ignore:
      - "**"
    paths:
      - "**/*.md"
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  ###########################################################
  check:
    ###########################################################
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Git Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install: Node.js"
        # https://github.com/actions/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"

      - name: "Install: Python"
        # https://github.com/actions/setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: "Install: pnpm"
        # https://github.com/pnpm/action-setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: "Install: Node.js dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Check: build tooling"
        run: pnpm check
