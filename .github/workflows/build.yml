#
# Builds native PostgreSQL archives and tests each archive after extraction.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Build

on: # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  push:
    branches-ignore:
      # Bot branches build through their pull requests.
      - "dependabot/**"
      - "dependencies/**" # Update Sources workflow
      # Merge queue branches build through merge_group, although GitHub also sends a push for them.
      - "gh-readonly-queue/**"
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/stale.yml"
  pull_request:
  merge_group:
  workflow_dispatch: # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  scope:
    name: Select native checks
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: scope
        run: |
          native=true
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            # The checkout is GitHub's test merge, and its first parent is the base it was merged onto.
            # The event's base SHA can be older than that parent and is then missing from this clone.
            if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
              echo "The checkout is not the pull request's test merge commit." >&2
              exit 1
            fi
            # Compare the tested merge with its base, including both paths of a rename.
            if git diff --quiet --no-renames --ignore-submodules=none HEAD^1 HEAD -- . \
              ':(exclude,glob)**/*.md' ':(exclude).github/workflows/stale.yml'; then
              native=false
            else
              status=$?
              [[ $status == 1 ]] || exit "$status"
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"

  ###########################################################
  docs:
    ###########################################################
    # Without native builds, nothing else here runs the repository checks, and the Documentation workflow
    # cannot be a required check because its path filter leaves some pull requests without it.
    name: Documentation
    needs: scope
    if: needs.scope.outputs.native == 'false'
    uses: ./.github/workflows/docs.yml

  ###########################################################
  build:
    ###########################################################
    name: Build (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images#available-images
        include:
          - os: ubuntu-26.04
            target: linux-x64-glibc
            output: linux-x64
            platform: linux/amd64
            test-command: binaries:test:linux
          - os: ubuntu-26.04-arm
            target: linux-arm64-glibc
            output: linux-arm64
            platform: linux/arm64
            test-command: binaries:test:linux
          - os: macos-15 # arm64
            target: macos-arm64
            output: macos-arm64
            test-command: binaries:test:macos
          - os: windows-2025
            target: windows-x64
            output: windows-x64
            test-command: binaries:test:windows

    steps:
      - name: Git Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install: Node.js"
        # https://github.com/actions/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"

      - name: "Install: Python"
        # https://github.com/actions/setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: "Install: pnpm"
        # https://github.com/pnpm/action-setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: "Install: Node.js dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Check: build tooling"
        run: pnpm check

      - name: "Prepare: Linux build image"
        if: runner.os == 'Linux'
        run: |
          image=$(node -p 'require("./binaries/linux/base.json").image')
          llvm=$(node -p 'require("./binaries/linux/base.json").llvm')
          docker build --platform "${{ matrix.platform }}" --tag portable-postgres-linux-build \
            --build-arg "UBUNTU_IMAGE=$image" --build-arg "LLVM_MAJOR=$llvm" binaries/linux/image

      - name: "Build: Linux native archive"
        id: linux-build
        if: runner.os == 'Linux'
        run: |
          # PGXS makefiles split paths containing spaces, including the SDK prefix.
          workspace="type=bind,source=$PWD,target=/workspace"
          if [[ ${ACT:-} == true ]]; then
            # act can hold the checkout in a Docker volume on the host daemon.
            volume=$(findmnt -n -o SOURCE -T "$PWD" | sed -nE 's@.*/volumes/(act-[^/]+)/_data\]$@\1@p')
            if [[ -n "$volume" ]]; then workspace="type=volume,source=$volume,target=/workspace"; fi
          fi
          docker run --rm --platform "${{ matrix.platform }}" --user "$(id -u):$(id -g)" \
            --mount "$workspace" --workdir /workspace --env BUILD_JOBS="$(nproc)" \
            portable-postgres-linux-build node binaries/linux/build.ts build

      - name: "Install: Windows build prerequisites"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Meson's PostgreSQL generators run as native Windows programs.
          $nativePerl = (Get-Command perl.exe).Source
          if ((& $nativePerl -V:osname) -notmatch 'MSWin32') { throw "Native Windows Perl is required" }
          "PG_BUILD_PERL=$nativePerl" >> $env:GITHUB_ENV
          "$env:ProgramFiles\7-Zip" >> $env:GITHUB_PATH
          python -m venv binaries/work/windows-toolchain
          & binaries/work/windows-toolchain/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r binaries/windows/requirements.txt

      - name: "Build: Windows native archive"
        id: windows-build
        if: runner.os == 'Windows'
        run: pnpm binaries:build:windows

      - name: "Build: macOS native archive"
        id: macos-build
        if: runner.os == 'macOS'
        # The recipe selects the Xcode that binaries/macos/base.json pins.
        run: pnpm binaries:build:macos

      - name: "Report: native build failure"
        if: >-
          failure() && (steps.linux-build.outcome == 'failure' || steps.windows-build.outcome == 'failure'
          || steps.macos-build.outcome == 'failure')
        run: |
          shopt -s nullglob
          for log in binaries/work/*-build-*/*-{configure,build,install,toolchain}.log; do
            printf '\n%s\n' "$log"
            tail -n 20 "$log"
          done

      - name: "Prepare: archive and SHA-256"
        id: archive
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          output_dir="binaries/output/$OUTPUT"
          archive_dir=$(mktemp -d "$output_dir/ci-XXXXXX")
          # The Linux proof drops root privileges when running under act.
          chmod 0755 "$archive_dir"
          # This job is the only build in this output directory, so its record names the archive built above.
          # The record keeps paths relative to the directory, because the Linux build container sees the checkout under another path.
          archive=$(cd "$output_dir" && node -p 'require("node:path").resolve(require("./last-build.json").archive)')
          archive_name=$(basename "$archive")
          cp "$archive" "$archive_dir/$archive_name"
          # macOS has shasum but no sha256sum; both write the same format.
          if command -v sha256sum > /dev/null; then sha256=(sha256sum); else sha256=(shasum -a 256); fi
          (cd "$archive_dir" && "${sha256[@]}" "$archive_name" > "$archive_name.sha256")
          mkdir "$archive_dir/installation"
          # -p keeps the archive's modes, so that the tests and the release check see them, not the runner's umask.
          if [[ $RUNNER_OS == Windows ]]; then
            python -m zipfile -e "$archive_dir/$archive_name" "$archive_dir/installation"
          else
            archive_tar=tar
            if [[ $RUNNER_OS == macOS ]]; then archive_tar=gtar; fi
            "$archive_tar" -xpzf "$archive_dir/$archive_name" -C "$archive_dir/installation"
          fi
          {
            echo "path=$archive_dir/$archive_name"
            echo "checksum=$archive_dir/$archive_name.sha256"
            echo "installation=$archive_dir/installation"
          } >> "$GITHUB_OUTPUT"

      - name: "Test: extracted PostgreSQL archive"
        env:
          TEST_COMMAND: ${{ matrix.test-command }}
          INSTALLATION: ${{ steps.archive.outputs.installation }}
        run: |
          python=python3
          if [[ $RUNNER_OS == Windows ]]; then python=python; fi
          "$python" tests/openssl-provider-directory.py "$INSTALLATION"
          pnpm "$TEST_COMMAND" "$INSTALLATION"

      - name: "Test: archive on Ubuntu 22.04"
        if: runner.os == 'Linux'
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          # A restrictive umask, as some developer machines have: the proof copies its scripts into the
          # consumer, where an unprivileged user must still be able to read them.
          umask 077
          pnpm binaries:test:linux:clean "${{ matrix.target }}" "$ARCHIVE"

      - name: "Test: archive on macOS without build tools"
        if: runner.os == 'macOS'
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          # The runner image always contains Xcode, which a user's Mac need not have, so the proof hides every
          # toolchain and runs without Node.js. Later steps need the tools back, for example git.
          xcode=$(mktemp -d "$RUNNER_TEMP/hidden-xcode.XXXXXX")
          tools=$(mktemp -d "$RUNNER_TEMP/hidden-tools.XXXXXX")
          sudo mv /Applications/Xcode*.app "$xcode"/
          sudo mv /Library/Developer/CommandLineTools "$tools"/
          trap 'sudo mv "$xcode"/* /Applications/ && sudo mv "$tools"/CommandLineTools /Library/Developer/' EXIT
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" \
            bash binaries/macos/test-consumer.sh "$ARCHIVE" | tee "$RUNNER_TEMP/macos-consumer.log"

      - name: "Test: macOS consumer TAP results"
        if: runner.os == 'macOS'
        run: node binaries/native-proof.ts "$RUNNER_TEMP/macos-consumer.log"

      - name: "Report: archive SHA-256"
        env:
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
        run: tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}" < "$CHECKSUM"

      - name: "Report: license review changes at ${{ github.sha }}"
        # Lists what this build reopens in the tracked review, so a pull request shows what needs a review.
        env:
          TARGET: ${{ matrix.target }}
          INSTALLATION: ${{ steps.archive.outputs.installation }}
        run: |
          draft="$RUNNER_TEMP/review-draft-$TARGET"
          pnpm binaries:review "$TARGET" "$INSTALLATION" --output "$draft.json" --summary "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: "Share: payload manifest"
        # The manifest lists files, hashes and versions but no binaries, so public CI shares it as well.
        # act's artifact server rejects this upload action.
        if: ${{ !env.ACT }}
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-${{ matrix.target }}
          path: ${{ steps.archive.outputs.installation }}/native-artifact.json
          if-no-files-found: error

      - name: "Share: license review draft"
        # The draft holds file names, hashes and licenses but no binaries, so public CI shares it as well.
        # act's artifact server rejects this upload action.
        if: ${{ !env.ACT }}
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-draft-${{ matrix.target }}
          path: ${{ runner.temp }}/review-draft-${{ matrix.target }}.json
          if-no-files-found: error

      - name: "Share: Windows linker evidence"
        if: ${{ runner.os == 'Windows' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-linked-inputs
          path: binaries/work/windows-build-*/windows-linked-inputs.txt
          if-no-files-found: error

      - name: "Share: native archive"
        # Keep the candidate available for inspection when approval is pending.
        # act's artifact server rejects this upload action.
        if: ${{ !env.ACT }}
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-postgres-${{ matrix.target }}
          path: |
            ${{ steps.archive.outputs.path }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          # The release job downloads these in the same run, so a release needs no longer retention.
          retention-days: 14

      - name: "Check: release review"
        env:
          TARGET: ${{ matrix.target }}
          INSTALLATION: ${{ steps.archive.outputs.installation }}
        run: pnpm binaries:validate "$TARGET" "$INSTALLATION"

  ###########################################################
  compare:
    ###########################################################
    name: Compare targets
    needs: build
    # A pending review fails its build job only after the manifest upload, so the comparison still runs then.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Git Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install: Node.js"
        # https://github.com/actions/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"

      - name: "Install: pnpm"
        # https://github.com/pnpm/action-setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: "Install: Node.js dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Download: payload manifests"
        # act's artifact server rejects the upload, so there is nothing to download.
        if: ${{ !env.ACT }}
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: manifest-*
          path: ${{ runner.temp }}/manifests

      - name: "Check: targets ship the same contents"
        # Each target installs its extensions with its own recipe, so every native build compares them as the
        # release job does, including builds whose review is still pending.
        if: ${{ !env.ACT }}
        run: pnpm binaries:compare --require-all-targets "$RUNNER_TEMP/manifests"

  readiness:
    name: Native release readiness
    needs: [scope, docs, build, compare]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks
        env:
          SCOPE: ${{ needs.scope.result }}
          NATIVE: ${{ needs.scope.outputs.native }}
          DOCS: ${{ needs.docs.result }}
          BUILD: ${{ needs.build.result }}
          COMPARE: ${{ needs.compare.result }}
        run: |
          case "$SCOPE/$NATIVE/$DOCS/$BUILD/$COMPARE" in
            success/true/skipped/success/success | success/false/success/skipped/skipped) exit 0 ;;
            *)
              echo "Checks failed: scope=$SCOPE native=$NATIVE docs=$DOCS build=$BUILD compare=$COMPARE"
              exit 1
              ;;
          esac
