#
# Builds, checks, and publishes one native release; a published release is never changed afterwards.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Release
# Shows in the run history whether a run only checked or published.
run-name: Release from ${{ github.ref_name }}${{ inputs.dry-run && ' (dry run)' || '' }}

on: # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  workflow_dispatch:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
    inputs:
      dry-run:
        description: Build and run release validation on every target with a recipe, without creating a tag or release
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  ###########################################################
  build:
    ###########################################################
    uses: ./.github/workflows/build.yml

  ###########################################################
  release:
    ###########################################################
    name: Publish release
    needs: build
    # Only main creates releases.
    if: ${{ !inputs.dry-run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: native-release
      cancel-in-progress: false

    permissions:
      contents: write # to create the tag and release
      id-token: write # to sign the build provenance
      attestations: write # to store the build provenance

    steps:
      - name: Git Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install: Node.js"
        # https://github.com/actions/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"

      - name: "Install: Python"
        # https://github.com/actions/setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: "Install: pnpm"
        # https://github.com/pnpm/action-setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: "Install: Node.js dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Download: native archives"
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portable-postgres-*
          merge-multiple: true
          path: release-downloads

      - name: "Prepare: release assets"
        id: prepare
        # The assets go to their own directory, from which the next steps attest and publish them.
        run: pnpm binaries:release release-downloads release-assets "$GITHUB_REPOSITORY" --require-all-targets

      - name: "Check: release tag is unused"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          # A published release is immutable; a correction needs the next packaging revision.
          if response=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1); then
            echo "Tag $TAG already exists; increase the packaging revision." >&2
            exit 1
          # Only a missing tag means unused; an API or network failure must not pass for one.
          elif ! grep -q 'HTTP 404' <<< "$response"; then
            echo "Could not check whether tag $TAG exists: $response" >&2
            exit 1
          fi

      - name: "Attest: build provenance"
        # https://github.com/actions/attest-build-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip

      - name: "Publish: GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          ASSETS: ${{ steps.prepare.outputs.assets }}
        working-directory: release-assets
        # https://cli.github.com/manual/gh_release_create
        run: |
          read -r -a assets <<< "$ASSETS"
          # Upload everything to a draft first, so the release never becomes visible with missing assets.
          gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md \
            --target "$GITHUB_SHA" "${assets[@]}"
          gh release edit "$TAG" --draft=false
