#
# Builds, checks, and publishes one native release; a published release is never changed afterwards.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Release

on: # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  workflow_dispatch:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
    inputs:
      dry-run:
        description: Build and prepare the release assets without creating a tag or release
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  ###########################################################
  build:
    ###########################################################
    uses: ./.github/workflows/build.yml
    with:
      # A real release runs the licence and host review in every build job, and each job uploads its own archive
      # once its review passes; the release job publishes only when every target arrived and the release is approved.
      validation: ${{ inputs.dry-run && 'candidate' || 'release' }}
      upload: ${{ !inputs.dry-run }}

  ###########################################################
  release:
    ###########################################################
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure required reviewers on the "release" environment so publication needs a manual approval.
    environment: release
    concurrency:
      group: native-release
      cancel-in-progress: false

    permissions:
      contents: write # to create the tag and release
      id-token: write # to sign the build provenance
      attestations: write # to store the build provenance

    steps: &release-steps
      - name: Git Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install: Node.js"
        # https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "package.json"

      - name: "Install: pnpm"
        # https://github.com/pnpm/action-setup
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: "Install: Node.js dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Download: native archives"
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portable-postgres-*
          merge-multiple: true
          path: release-downloads

      - name: "Prepare: release assets"
        id: prepare
        env:
          REQUIRE_ALL: ${{ !inputs.dry-run && '--require-all-targets' || '' }}
        run: |
          # shellcheck disable=SC2086  # REQUIRE_ALL is either empty or a single flag.
          # The assets go to their own directory, from which the next steps attest and publish them.
          pnpm binaries:release release-downloads release-assets "$GITHUB_REPOSITORY" $REQUIRE_ALL

      - name: "Check: release tag is unused"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          # A published release is immutable; a correction needs the next packaging revision.
          if response=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1); then
            echo "Tag $TAG already exists; increase the packaging revision." >&2
            exit 1
          # Only a missing tag means unused; an API or network failure must not pass for one.
          elif ! grep -q 'HTTP 404' <<< "$response"; then
            echo "Could not check whether tag $TAG exists: $response" >&2
            exit 1
          fi

      - name: "Attest: build provenance"
        if: ${{ !inputs.dry-run }}
        # https://github.com/actions/attest-build-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.tar.gz

      - name: "Publish: GitHub release"
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          ASSETS: ${{ steps.prepare.outputs.assets }}
        working-directory: release-assets
        # https://cli.github.com/manual/gh_release_create
        run: |
          read -r -a assets <<< "$ASSETS"
          # Upload everything to a draft first, so the release never becomes visible with missing assets.
          gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md \
            --target "$GITHUB_SHA" "${assets[@]}"
          gh release edit "$TAG" --draft=false

  ###########################################################
  dry-run:
    ###########################################################
    needs: build
    # Public candidate builds have no archive artifacts to prepare.
    if: ${{ inputs.dry-run && github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-dry-run
    # Only publication needs a write token. This job inherits the workflow's read-only permissions.
    steps: *release-steps
