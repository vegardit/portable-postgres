#
# Opens a pull request when PostgreSQL or a bundled extension has a newer release than its pin.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Update Sources

on: # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  schedule:
    - cron: "0 5 * * 1" # every Monday at 5 a.m. UTC
  workflow_dispatch:
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  ###########################################################
  update-sources:
    ###########################################################
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: update-sources
      cancel-in-progress: false

    steps:
      - name: Git Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The packaging revision depends on whether the current version already has a release tag.
          fetch-tags: true

      - name: "Install: Node.js"
        # https://github.com/actions/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"

      - name: "Install: pnpm"
        # https://github.com/pnpm/action-setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: "Install: Node.js dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Update: pinned sources"
        id: update
        env:
          # Only raises GitHub's API rate limit for the public tag lookups.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/source-updates.md"
          pnpm binaries:update-pins --summary "$summary"
          # The updater writes a summary only when a pin changed.
          if [[ -f "$summary" ]]; then
            # https://github.com/orgs/community/discussions/26288#discussioncomment-3876281
            delimiter="$(openssl rand -hex 8)"
            {
              echo "body<<$delimiter"
              cat "$summary"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

      # Pull requests created with GITHUB_TOKEN need a manual approval before their workflows run.
      - name: "Create: pull request updater token"
        id: app-token
        if: steps.update.outputs.body
        # https://github.com/actions/create-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PR_UPDATER_APP_ID }}
          private-key: ${{ secrets.PR_UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: "Create: pull request"
        if: steps.update.outputs.body
        # https://github.com/peter-evans/create-pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          title: "chore: Update pinned sources"
          commit-message: "chore: Update pinned sources"
          body: ${{ steps.update.outputs.body }}
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          add-paths: |
            binaries/sources/sources.json
            binaries/sources/revision.json
          branch: dependencies/sources
          delete-branch: true
          token: ${{ steps.app-token.outputs.token }}
