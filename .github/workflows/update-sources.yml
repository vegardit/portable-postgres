#
# Opens a pull request when PostgreSQL or a bundled extension has a newer release than its pin.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Update Sources

on: # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  schedule:
    - cron: "0 5 * * 1" # every Monday at 5 a.m. UTC
  workflow_dispatch:
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  ###########################################################
  update-sources:
    ###########################################################
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The GitHub CLI reads GH_REPO for the `gh api` calls in update-branch.ts and the PR update below.
      # It uses it to expand {owner}/{repo} to the repository running the workflow.
      # It also selects this repository for `gh pr list` and `gh pr create`, including on forks.
      GH_REPO: ${{ github.repository }}
    concurrency:
      group: update-sources
      cancel-in-progress: false

    steps:
      - name: Git Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The revision uses release tags, and the updater compares the PR's history with its base.
          fetch-depth: 0

      - name: "Install: Node.js"
        # https://github.com/actions/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"

      - name: "Install: pnpm"
        # https://github.com/pnpm/action-setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: "Install: Node.js dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Update: pinned sources"
        id: update
        env:
          # Only raises GitHub's API rate limit for the public tag lookups.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/source-updates.md"
          pnpm binaries:update-pins --summary "$summary"
          # The updater writes a summary only when a pin changed.
          if [[ -f "$summary" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests created with GITHUB_TOKEN need a manual approval before their workflows run.
      - name: "Create: pull request updater token"
        id: app-token
        if: steps.update.outputs.changed
        # https://github.com/actions/create-github-app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.PR_UPDATER_APP_ID }}
          private-key: ${{ secrets.PR_UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: "Publish: inspected source-update branch"
        id: branch
        if: steps.update.outputs.changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          node binaries/sources/update-branch.ts

      - name: "Create or update: pull request"
        if: steps.branch.outputs.name
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          pr=$(gh pr list --state open --base "$GITHUB_REF_NAME" --head "$SOURCE_BRANCH" \
            --json number,isCrossRepository --jq 'map(select(.isCrossRepository == false))[0].number // empty')
          title="chore: Update pinned sources"
          summary="$RUNNER_TEMP/source-updates.md"
          if [[ -n "$pr" ]]; then
            # Updating the PR directly needs no access to the teams listed as reviewers.
            gh api --method PATCH "repos/{owner}/{repo}/pulls/$pr" \
              --raw-field "title=$title" --field "body=@$summary" --silent
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$SOURCE_BRANCH" --title "$title" --body-file "$summary"
          fi
