# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    commit-message:
      prefix: ci
      prefix-development: ci
      include: scope
    labels:
      - dependencies
      - gha
      - pinned

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    # Raises the exact pins, but leaves a range such as @types/node ">=26" alone while it admits the release.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    labels:
      - dependencies
      - npm
      - pinned
