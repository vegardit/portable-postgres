# Server settings that the Linux and Windows native proofs both append to postgresql.conf.
# Clients connect only over authenticated TCP; Windows creates no Unix socket by default, Linux would.
listen_addresses = '127.0.0.1'
unix_socket_directories = ''
shared_preload_libraries = 'timescaledb,pg_textsearch,pg_cron'
timescaledb.telemetry_level = 'off'
cron.database_name = 'postgres'
cron.use_background_workers = on
cron.max_running_jobs = 4
max_worker_processes = 16
